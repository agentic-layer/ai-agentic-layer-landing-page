<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .container-box {
        fill: none;
        stroke: #666666;
        stroke-width: 2;
        stroke-dasharray: none;
      }
      .component-box {
        fill: #e5e5e5;
        stroke: #999999;
        stroke-width: 1;
        rx: 4;
        ry: 4;
      }
      .title-text {
        font-family: Arial, sans-serif;
        font-size: 18px;
        font-weight: bold;
        fill: #666666;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .component-text {
        font-family: Arial, sans-serif;
        font-size: 14px;
        font-weight: 600;
        fill: #333333;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .subtitle-text {
        font-family: Arial, sans-serif;
        font-size: 12px;
        fill: #666666;
        text-anchor: middle;
        dominant-baseline: middle;
      }
    </style>
  </defs>
  
  <!-- Top container -->
  <rect x="50" y="80" width="500" height="120" class="container-box"/>
  
  <!-- Top row components -->
  <rect x="70" y="110" width="140" height="60" class="component-box"/>
  <text x="140" y="130" class="component-text">Agent</text>
  <text x="140" y="150" class="component-text">Testbench</text>
  
  <rect x="230" y="110" width="140" height="60" class="component-box"/>
  <text x="300" y="130" class="component-text">Agent</text>
  <text x="300" y="150" class="component-text">Observability</text>
  
  <rect x="390" y="110" width="140" height="60" class="component-box"/>
  <text x="460" y="130" class="component-text">Agent</text>
  <text x="460" y="150" class="component-text">Catalog</text>
  
  <!-- Middle section title -->
  <text x="300" y="260" class="title-text">Agentic Workforce</text>
  <text x="300" y="285" class="subtitle-text">(Agents &amp; Connectors)</text>
  
  <!-- Bottom container -->
  <rect x="50" y="330" width="500" height="120" class="container-box"/>
  
  <!-- Bottom row components -->
  <rect x="70" y="360" width="140" height="60" class="component-box"/>
  <text x="140" y="375" class="component-text">Agent Runtime</text>
  <text x="140" y="395" class="subtitle-text">(Multi-Framework)</text>
  
  <rect x="230" y="360" width="140" height="60" class="component-box"/>
  <text x="300" y="375" class="component-text">AI Gateway</text>
  <text x="300" y="395" class="subtitle-text">(Multi-Model)</text>
  
  <rect x="390" y="360" width="140" height="60" class="component-box"/>
  <text x="460" y="375" class="component-text">Agent Gateway</text>
  <text x="460" y="395" class="subtitle-text">(Multi-Frontend)</text>
</svg>