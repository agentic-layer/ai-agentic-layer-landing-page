<svg width="600" height="450" viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Light gray background -->
  <rect width="600" height="450" fill="#f8f8f8"/>
  
  <!-- Top container -->
  <rect x="25" y="40" width="550" height="110" fill="white" stroke="#333" stroke-width="1"/>
  
  <!-- Top row components -->
  <rect x="50" y="65" width="150" height="60" fill="#e8e8e8" rx="4" ry="4"/>
  <text x="125" y="90" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#333" text-anchor="middle" dominant-baseline="middle">Agent</text>
  <text x="125" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#333" text-anchor="middle" dominant-baseline="middle">Testbench</text>
  
  <rect x="225" y="65" width="150" height="60" fill="#e8e8e8" rx="4" ry="4"/>
  <text x="300" y="90" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#333" text-anchor="middle" dominant-baseline="middle">Agent</text>
  <text x="300" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#333" text-anchor="middle" dominant-baseline="middle">Observability</text>
  
  <rect x="400" y="65" width="150" height="60" fill="#e8e8e8" rx="4" ry="4"/>
  <text x="475" y="90" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#333" text-anchor="middle" dominant-baseline="middle">Agent</text>
  <text x="475" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#333" text-anchor="middle" dominant-baseline="middle">Catalog</text>
  
  <!-- Middle section title -->
  <text x="300" y="205" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#666" text-anchor="middle" dominant-baseline="middle">Agentic Workforce</text>
  <text x="300" y="225" font-family="Arial, sans-serif" font-size="16" fill="#666" text-anchor="middle" dominant-baseline="middle">(Agents &amp; Connectors)</text>
  
  <!-- Bottom container -->
  <rect x="25" y="270" width="550" height="110" fill="white" stroke="#333" stroke-width="1"/>
  
  <!-- Bottom row components -->
  <rect x="50" y="295" width="150" height="60" fill="#e8e8e8" rx="4" ry="4"/>
  <text x="125" y="315" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#333" text-anchor="middle" dominant-baseline="middle">Agent Runtime</text>
  <text x="125" y="335" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle" dominant-baseline="middle">(Multi-Framework)</text>
  
  <rect x="225" y="295" width="150" height="60" fill="#e8e8e8" rx="4" ry="4"/>
  <text x="300" y="315" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#333" text-anchor="middle" dominant-baseline="middle">AI Gateway</text>
  <text x="300" y="335" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle" dominant-baseline="middle">(Multi-Model)</text>
  
  <rect x="400" y="295" width="150" height="60" fill="#e8e8e8" rx="4" ry="4"/>
  <text x="475" y="315" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#333" text-anchor="middle" dominant-baseline="middle">Agent Gateway</text>
  <text x="475" y="335" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle" dominant-baseline="middle">(Multi-Frontend)</text>
</svg>